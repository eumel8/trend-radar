apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trendsde
resources:
  - deploy/resources.yaml
  - deploy/jobs.yaml
  - deploy/refresh.yaml
patches:
  - target:
      kind: CronJob
      name: trendsde-collector
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
        value:
          name: app-config
          mountPath: /app/config.toml
          subPath: config.toml
          readOnly: true
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/-
        value:
          name: app-config
          configMap:
            name: trendsde-app-config
  - target:
      kind: CronJob
      name: trendsde-video
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
        value:
          name: app-config
          mountPath: /app/config.toml
          subPath: config.toml
          readOnly: true
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/-
        value:
          name: app-config
          configMap:
            name: trendsde-app-config
configMapGenerator:
  - name: trendsde-app-config
    files:
      - config.toml
  - name: trendsde-site
    files:
      - site/index.html
      - site/results.html
      - site/privacy.html
      - site/terms.html
      - site/contact.html
      - site/style.css
      - site/branding.html
      - assets/channel-logo.svg
      - assets/channel-banner.svg
      - assets/channel-logo.png
      - assets/channel-banner.png
  - name: trendsde-nginx
    files:
      - deploy/nginx.conf
