apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trendsde-registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendsde-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trendsde-registry
  template:
    metadata:
      labels:
        app: trendsde-registry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: TrendsDE
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: trendsde-registry
        - name: auth
          secret:
            secretName: trendsde-registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: trendsde-registry
spec:
  selector:
    app: trendsde-registry
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trendsde-registry
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [trendsde.b.eumel.de]
      secretName: trendsde-b-eumel-de-tls
  rules:
    - host: trendsde.b.eumel.de
      http:
        paths:
          - path: /v2/
            pathType: Prefix
            backend:
              service:
                name: trendsde-registry
                port:
                  number: 5000
