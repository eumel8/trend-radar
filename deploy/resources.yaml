apiVersion: v1
kind: Namespace
metadata:
  name: trendsde
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendsde-site
  labels:
    app: trendsde-site
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: trendsde-site
  template:
    metadata:
      labels:
        app: trendsde-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.28-alpine
          command: [nginx, -c, /etc/nginx/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /srv/data
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: trendsde-site
        - name: nginx
          configMap:
            name: trendsde-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: data
          persistentVolumeClaim:
            claimName: trendsde-data
---
apiVersion: v1
kind: Service
metadata:
  name: trendsde-site
spec:
  selector:
    app: trendsde-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trendsde-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [trendsde.b.eumel.de]
      secretName: trendsde-b-eumel-de-tls
  rules:
    - host: trendsde.b.eumel.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trendsde-site
                port:
                  name: http
