apiVersion: batch/v1
kind: CronJob
metadata:
  name: trendsde-refresh
spec:
  schedule: "0 13,19 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: ghcr.io/eumel8/trend-radar:main
              imagePullPolicy: Always
              args: [refresh]
              env:
                - name: YOUTUBE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: trendsde-api
                      key: api-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: app-config
                  mountPath: /app/config.toml
                  subPath: config.toml
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: trendsde-data
            - name: app-config
              configMap:
                name: trendsde-app-config
            - name: tmp
              emptyDir: {}
